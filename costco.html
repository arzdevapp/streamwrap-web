<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Costco Grocery Calculator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;background:#0f0f0f;color:#fff;min-height:100vh;padding-bottom:100px}
.top{background:#1a1a2e;padding:16px 20px;position:sticky;top:0;z-index:10;border-bottom:1px solid #2a2a3e}
.top h1{font-size:20px;color:#e31837;margin-bottom:4px}
.top .sub{font-size:12px;color:#888}
.total-bar{position:fixed;bottom:0;left:0;right:0;background:#1a1a2e;border-top:2px solid #e31837;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;z-index:10}
.total-bar .big{font-size:24px;font-weight:800}
.total-bar .big span{color:#e31837}
.total-bar .items{font-size:12px;color:#888}
.total-bar button{background:#e31837;color:#fff;border:none;padding:8px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.add-row{padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.add-row input,.add-row select{background:#1e1e2e;border:1px solid #2a2a3e;color:#fff;padding:10px 12px;border-radius:8px;font-size:14px}
.add-row input.name{flex:2;min-width:120px}
.add-row input.price{flex:1;min-width:80px}
.add-row input.qty{width:60px;text-align:center}
.add-row select.tax{width:80px}
.add-row button{background:#e31837;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px}
.add-row button.scan{background:#1e1e2e;border:1px solid #2a2a3e;font-size:20px;padding:10px 12px}
.add-row button.scan:hover{background:#2a2a3e}
.list{padding:0 20px}
.item{background:#1a1a2e;border:1px solid #2a2a3e;border-radius:10px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.item .info{flex:1;min-width:0}
.item .info .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .info .det{font-size:12px;color:#888;margin-top:2px}
.item .price{text-align:right}
.item .price .pr{font-size:16px;font-weight:700}
.item .price .ea{font-size:11px;color:#888}
.item .del{color:#e31837;background:none;border:none;font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px}
.item .del:hover{background:#2a2a3e}
.item.taxable{border-left:3px solid #f39c12}
.empty{text-align:center;padding:40px;color:#555}
.empty .icon{font-size:48px;margin-bottom:12px}
.stats{padding:0 20px;margin-bottom:16px}
.stats .row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px solid #1a1a2e}
.stats .row:last-child{border-bottom:2px solid #e31837;font-weight:700;font-size:16px}
.stats .row .lbl{color:#888}
.stats .row .val{color:#fff}
.stats .row .val.taxed{color:#f39c12}
.btn-sm{background:#2a2a3e;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer}
.btn-sm.danger{background:#e31837}
.actions{display:flex;gap:8px;padding:0 20px;margin-bottom:12px}
/* Scanner overlay */
#scanner{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:100;flex-direction:column}
#scanner.on{display:flex}
#scanner video{flex:1;width:100%;object-fit:cover}
#scanner .scan-hud{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:250px;height:150px;border:2px solid #e31837;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.5)}
#scanner .scan-hud::after{content:'Align barcode here';position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;white-space:nowrap}
#scanner .scan-close{position:absolute;top:16px;right:16px;background:rgba(0,0,0,.6);color:#fff;border:none;font-size:24px;width:44px;height:44px;border-radius:50%;cursor:pointer;z-index:101}
#scanner .scan-status{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);color:#fff;font-size:14px;background:rgba(0,0,0,.7);padding:8px 16px;border-radius:20px}
</style>
</head>
<body>

<div class="top">
  <h1>🛒 Costco Grocery Calc</h1>
  <div class="sub">BC — GST 5% on prepared foods &amp; non-grocery · Tap 📷 to scan barcode</div>
</div>

<div class="add-row">
  <button class="scan" id="scanBtn" title="Scan barcode">📷</button>
  <input class="name" id="itemName" placeholder="Item name" autocomplete="off">
  <input class="price" id="itemPrice" placeholder="Price" type="number" step="0.01" min="0" value="">
  <input class="qty" id="itemQty" type="number" min="1" value="1">
  <select class="tax" id="itemTax"><option value="0">No tax</option><option value="5">GST 5%</option></select>
  <button id="addBtn">+ Add</button>
</div>

<div class="actions">
  <button class="btn-sm" id="clearBtn">Clear All</button>
  <button class="btn-sm" id="exportBtn">📋 Copy List</button>
</div>

<div class="list" id="list"></div>
<div class="stats" id="stats" style="display:none"></div>

<div class="total-bar">
  <div><div class="big">$<span id="totalAmt">0.00</span></div><div class="items"><span id="itemCount">0</span> items</div></div>
  <button id="resetBtn">Reset</button>
</div>

<!-- Barcode Scanner -->
<div id="scanner">
  <button class="scan-close" id="scanClose">✕</button>
  <video id="scanVideo" autoplay playsinline></video>
  <div class="scan-hud"></div>
  <div class="scan-status" id="scanStatus">Point camera at a barcode</div>
  <div style="position:absolute;bottom:90px;left:50%;transform:translateX(-50%);display:flex;gap:8px">
    <input id="manualBarcode" type="text" inputmode="numeric" placeholder="Or type barcode..." style="background:rgba(0,0,0,.7);color:#fff;border:1px solid #555;padding:8px 14px;border-radius:8px;font-size:14px;width:180px;text-align:center">
    <button id="manualLookup" style="background:#e31837;color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer">Lookup</button>
  </div>
</div>

<script>
var S = JSON.parse(localStorage.getItem("costco_calc")) || {items:[]};
function sv(){ localStorage.setItem("costco_calc", JSON.stringify(S)); }
function fmt(n){ return n.toFixed(2); }

function render(){
  var h='',total=0,taxTotal=0,itemCount=0;
  if(!S.items.length){ h='<div class="empty"><div class="icon">🛒</div><p>Add items or scan barcodes to start</p></div>'; }
  S.items.forEach(function(item,i){
    var sub=item.price*item.qty, tax=item.taxable?sub*0.05:0;
    total+=sub+tax; taxTotal+=tax; itemCount+=item.qty;
    var unit=item.qty>1?(sub/item.qty):item.price;
    h+='<div class="'+(item.taxable?'item taxable':'item')+'">';
    h+='<div class="info"><div class="nm">'+esc(item.name)+'</div>';
    h+='<div class="det">'+item.qty+' × $'+fmt(item.price)+' = $'+fmt(sub);
    if(item.taxable) h+=' <span style="color:#f39c12">+GST $'+fmt(tax)+'</span>';
    if(item.qty>1) h+='  |  $'+fmt(unit)+'/ea';
    h+='</div></div>';
    h+='<div class="price"><div class="pr">$'+fmt(sub+tax)+'</div><div class="ea">'+(item.taxable?'+tax':'')+'</div></div>';
    h+='<button class="del" data-i="'+i+'">✕</button></div>';
  });
  document.getElementById('list').innerHTML=h;
  document.getElementById('totalAmt').textContent=fmt(total);
  document.getElementById('itemCount').textContent=itemCount;
  var st=document.getElementById('stats');
  if(S.items.length>0){
    st.style.display='block';
    var sub=total-taxTotal;
    st.innerHTML='<div class="row"><span class="lbl">Subtotal</span><span class="val">$'+fmt(sub)+'</span></div>'+
      '<div class="row"><span class="lbl">GST (5%)</span><span class="val taxed">$'+fmt(taxTotal)+'</span></div>'+
      '<div class="row"><span class="lbl">Estimated Total</span><span class="val" style="color:#e31837">$'+fmt(total)+'</span></div>';
  }else{st.style.display='none';}
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

document.getElementById('addBtn').onclick=function(){
  var name=document.getElementById('itemName').value.trim();
  var price=parseFloat(document.getElementById('itemPrice').value);
  var qty=parseInt(document.getElementById('itemQty').value)||1;
  var taxable=document.getElementById('itemTax').value==='5';
  if(!name){alert('Enter an item name');return;}
  if(isNaN(price)||price<0){alert('Enter a valid price');return;}
  S.items.push({name:name,price:price,qty:qty,taxable:taxable});
  sv();render();
  document.getElementById('itemName').value='';
  document.getElementById('itemPrice').value='';
  document.getElementById('itemQty').value='1';
  document.getElementById('itemName').focus();
};

['itemName','itemPrice'].forEach(function(id){
  document.getElementById(id).addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('addBtn').click();});
});

document.addEventListener('click',function(e){
  if(e.target.classList.contains('del')){ var i=parseInt(e.target.dataset.i); S.items.splice(i,1); sv(); render(); }
});

document.getElementById('clearBtn').onclick=function(){
  if(S.items.length&&confirm('Remove all '+S.items.length+' items?')){S.items=[];sv();render();}
};
document.getElementById('resetBtn').onclick=function(){
  if(S.items.length&&confirm('Clear the entire list?')){S.items=[];sv();render();}
};

document.getElementById('exportBtn').onclick=function(){
  var lines=['Costco Grocery List — '+new Date().toLocaleDateString(),''],total=0,taxTotal=0;
  S.items.forEach(function(item){
    var sub=item.price*item.qty, tax=item.taxable?sub*0.05:0;
    total+=sub+tax; taxTotal+=tax;
    var line='• '+item.name+' — '+item.qty+' × $'+fmt(item.price)+' = $'+fmt(sub);
    if(item.taxable) line+=' +GST $'+fmt(tax);
    lines.push(line);
  });
  lines.push('','Subtotal: $'+fmt(total-taxTotal),'GST: $'+fmt(taxTotal),'Total: $'+fmt(total));
  navigator.clipboard.writeText(lines.join('\n')).then(function(){alert('Copied!');}).catch(function(){alert('Copy failed');});
};

// ── Barcode Scanner ──
var scanner=document.getElementById('scanner');
var video=document.getElementById('scanVideo');
var scanStatus=document.getElementById('scanStatus');
var manualBarcode=document.getElementById('manualBarcode');
var stream=null;
var detector=null;
var scanInterval=null;
var scanning=false;

// Try to init BarcodeDetector
(function initDetector(){
  if(!('BarcodeDetector' in window)){
    scanStatus.textContent='BarcodeDetector not supported in this browser';
    return;
  }
  // Try different format sets — some browsers reject certain formats
  var formats=[
    ['ean_13','ean_8','upc_a','upc_e'],
    ['ean_13','upc_a','upc_e'],
    ['ean_13','upc_a'],
  ];
  for(var i=0;i<formats.length;i++){
    try{ detector=new BarcodeDetector({formats:formats[i]}); break; }
    catch(e){ continue; }
  }
  if(!detector) scanStatus.textContent='No supported barcode formats';
})();

document.getElementById('scanBtn').onclick=async function(){
  scanner.classList.add('on');
  scanStatus.textContent='Starting camera...';
  manualBarcode.value='';

  // Try camera
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}
    });
    video.srcObject=stream;
    await video.play();
    scanStatus.textContent=detector?'Point camera at a barcode':'Camera on — type barcode below';
    if(detector){
      scanning=true;
      scanInterval=setInterval(scanFrame,300);
    }
  }catch(e){
    scanStatus.textContent='Camera blocked: '+e.message.split(':').pop().trim();
    // Still let user type barcode manually
  }
};

document.getElementById('scanClose').onclick=closeScanner;

function closeScanner(){
  scanning=false;
  if(scanInterval){ clearInterval(scanInterval); scanInterval=null; }
  if(stream){ stream.getTracks().forEach(function(t){t.stop()}); stream=null; }
  video.srcObject=null;
  scanner.classList.remove('on');
}

async function scanFrame(){
  if(!scanning||!detector||video.readyState<2) return;
  try{
    var barcodes=await detector.detect(video);
    if(barcodes.length>0){
      scanning=false;
      if(scanInterval){ clearInterval(scanInterval); scanInterval=null; }
      var code=barcodes[0].rawValue;
      scanStatus.textContent='Found: '+code+' — looking up product...';
      await fillFromBarcode(code);
      closeScanner();
    }
  }catch(e){ /* detection can fail on some frames */ }
}

// Manual barcode entry
document.getElementById('manualLookup').onclick=async function(){
  var code=manualBarcode.value.trim();
  if(!code||code.length<8){ scanStatus.textContent='Enter at least 8 digits'; return; }
  scanStatus.textContent='Looking up '+code+'...';
  await fillFromBarcode(code);
  closeScanner();
};
manualBarcode.addEventListener('keydown',function(e){
  if(e.key==='Enter') document.getElementById('manualLookup').click();
});

async function fillFromBarcode(code){
  var name=await lookupUPC(code);
  if(name){
    document.getElementById('itemName').value=name;
    document.getElementById('itemPrice').focus();
  }else{
    // Product not found — use the code as the name
    document.getElementById('itemName').value='UPC '+code;
    document.getElementById('itemPrice').focus();
    scanStatus.textContent='Product not found — enter name & price manually';
  }
}

async function lookupUPC(code){
  // Try Open Food Facts first
  try{
    var r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json');
    if(r.ok){
      var d=await r.json();
      if(d.status===1&&d.product){
        var p=d.product;
        var name=p.product_name||p.generic_name||'';
        var brand=(p.brands||'').split(',')[0].trim();
        if(name&&brand&&!name.toLowerCase().includes(brand.toLowerCase())) name=brand+' '+name;
        if(name) return name;
      }
    }
  }catch(e){}
  // Fallback: UPCitemdb
  try{
    var r2=await fetch('https://api.upcitemdb.com/prod/trial/lookup?upc='+code);
    if(r2.ok){
      var d2=await r2.json();
      if(d2.items&&d2.items.length>0) return d2.items[0].title;
    }
  }catch(e){}
  return null;
}

render();
</script>
</body>
</html>
